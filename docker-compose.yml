services:
  resume-expert:
    build: .
    image: resume-expert:local
    container_name: resume-expert
    restart: unless-stopped
    ports:
      - "5173:7860"
    env_file:
      - .env
    environment:
      PORT: "7860"
    volumes:
      # 命名卷而非 bind mount，避免宿主机目录权限导致容器内 node 用户写不了日志
      - resume-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7860/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  resume-logs:
